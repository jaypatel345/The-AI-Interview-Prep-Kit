# Render blueprint for the API. In Render: New > Blueprint > point at this repo.
# Secrets are marked sync:false, so Render prompts for them instead of storing them here.
services:
  - type: web
    name: prep-kit-api
    runtime: node
    rootDir: backend
    plan: free
    # --include=dev is required: NODE_ENV=production makes npm skip devDependencies,
    # and the build needs typescript and @types/node from there.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET          # signs the session cookie
        generateValue: true      # Render generates a strong value; never paste one in
      - key: MONGODB_URI         # Atlas SRV string, including the database name
        sync: false
      - key: LLM_API_KEY         # Google AI Studio key
        sync: false
      - key: FRONTEND_ORIGIN     # exact Vercel URL, e.g. https://your-app.vercel.app
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL
        value: gemini-3.1-flash-lite
      - key: LLM_RPM
        value: "8"
      - key: LLM_REASONING_EFFORT
        value: none
      - key: CRAWL_MAX_PAGES
        value: "8"
      - key: CRAWL_DELAY_MS
        value: "400"
